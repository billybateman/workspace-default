<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TenderHeart Workspace</title>
  <style id="tenderheart-scrollbar-theme" data-tenderheart-theme="scrollbars">
    /* Chrome / Edge / Brave / Safari */

    *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
    }

    *::-webkit-scrollbar-track {
        background: var(--scrollbar-track, #12151d);
    }

    *::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb, #3c4658);
        border-radius: 999px;
        border: 2px solid var(--scrollbar-track, #12151d);
    }

    *::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover, #556277);
    }

    *::-webkit-scrollbar-corner {
        background: var(--scrollbar-track, #12151d);
    }

    /* Firefox */

    * {
        scrollbar-width: thin;
        scrollbar-color:
            var(--scrollbar-thumb, #3c4658)
            var(--scrollbar-track, #12151d);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
